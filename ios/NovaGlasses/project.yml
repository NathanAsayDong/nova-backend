# XcodeGen spec. The .xcodeproj is generated from this file:
#   brew install xcodegen && xcodegen generate
# Edit this file, not the project, so the two never drift.
name: NovaGlasses
options:
  bundleIdPrefix: us.nova-api
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Set your team once here (or in Xcode's Signing tab) to install on a device.
    DEVELOPMENT_TEAM: B85B73KX6L
    CODE_SIGN_STYLE: Automatic
packages:
  # Meta Wearables Device Access Toolkit: the glasses camera. Audio does not
  # use it; the glasses' mic and speakers are a plain Bluetooth headset.
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  NovaGlasses:
    type: application
    platform: iOS
    sources:
      - path: NovaGlasses
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    info:
      path: NovaGlasses/Info.plist
      properties:
        CFBundleDisplayName: Nova
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The audio engine keeps running while the phone is locked, which is
        # what keeps the app (and "Hey Nova") alive in the background.
        # bluetooth-central keeps the toolkit's link to the glasses alive.
        UIBackgroundModes: [audio, bluetooth-central]
        NSMicrophoneUsageDescription: >-
          Nova listens through your glasses' microphone for "Hey Nova" and for
          what you ask it.
        NSSpeechRecognitionUsageDescription: >-
          Nova recognizes the "Hey Nova" wake phrase on this iPhone, without
          sending idle audio anywhere.
        NovaAPIBaseURL: https://api.nova-api.us
        # Lets the login screen point at a backend on the Mac over plain http
        # (http://<mac-ip>:8000) for on-device testing before the tunnel.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Nova receives photos from your glasses over Wi-Fi, and connects to a
          Nova server on your local network when you point it at one.
        NSBonjourServices: [_bonjour._tcp]
        NSBluetoothAlwaysUsageDescription: >-
          Nova connects to your Meta glasses to take a photo when you ask it
          what it sees.
        NSCameraUsageDescription: >-
          Nova uses the glasses camera when you ask it to look at something.
        NSPhotoLibraryUsageDescription: >-
          Pick photos of a friend's face so Nova can recognize them.
        # The Meta AI app hands control back here after registration.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: us.nova-api.NovaGlasses
            CFBundleURLSchemes: [novaglasses]
        # Developer Mode on the glasses: no MetaAppID or ClientToken needed.
        MWDAT:
          AppLinkURLScheme: "novaglasses://"
          MetaAppID: ""
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.nova-api.NovaGlasses
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  NovaGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovaGlassesTests
        excludes:
          - Fixtures/**
      - path: NovaGlassesTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: NovaGlasses
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.nova-api.NovaGlassesTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NovaGlasses.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NovaGlasses"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NovaGlasses:
    build:
      targets:
        NovaGlasses: all
        NovaGlassesTests: [test]
    test:
      targets:
        - NovaGlassesTests
