<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Nova app icon: the web UI's white orb, lit from inside, on the brand greens. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd36c"/>
      <stop offset="0.55" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="540" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#e9f8ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9f8ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="430" cy="430" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f4f9f5"/>
      <stop offset="1" stop-color="#cfe9d8"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="420" fill="url(#halo)"/>

  <!-- the orb -->
  <circle cx="512" cy="540" r="290" fill="url(#orb)"/>
  <circle cx="512" cy="540" r="290" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6"/>
  <ellipse cx="455" cy="390" rx="175" ry="95" fill="url(#gloss)" transform="rotate(-28 455 390)"/>

  <!-- the new star: a four-point sparkle breaking the orb's rim -->
  <path fill="#ffffff"
        d="M752 186 C762 260 782 280 856 290 C782 300 762 320 752 394 C742 320 722 300 648 290 C722 280 742 260 752 186 Z"/>
</svg>
